ame: Test dostepu do Azure

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-azure:
    runs-on: ubuntu-latest

    steps:
      - name: Logowanie do Azure przez OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sprawdz subskrypcje
        run: |
          az account show \
            --query "{Nazwa:name,SubscriptionID:id,TenantID:tenantId}" \
            --output table

      - name: Sprawdz dostepne grupy zasobow
        run: |
          az group list \
            --query "[].{Nazwa:name,Lokalizacja:location}" \
            --output table

      - name: Potwierdzenie
        run: |
          echo "TEST OK - GitHub Actions uzyskal dostep do Azure przez OIDC"
